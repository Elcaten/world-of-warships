server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare's challenge can replay the original navigation as a POST.
    # Finish that flow with Post/Redirect/Get so reloading never resubmits it.
    # Relative redirects preserve the visitor's HTTPS scheme behind Cloudflare.
    absolute_redirect off;
    if ($request_method = POST) {
        return 303 $request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Preserve the path: /api/encyclopedia/en/... → vortex.../api/encyclopedia/en/...
    location /api/encyclopedia/ {
        proxy_pass https://vortex.worldofwarships.eu;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name vortex.worldofwarships.eu;
        proxy_set_header Host vortex.worldofwarships.eu;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
